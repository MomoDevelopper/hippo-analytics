# Render.com deployment configuration
services:
  # Backend FastAPI
  - type: web
    name: hippo-analytics-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hippo-analytics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: LONAB_BASE_URL
        value: https://www.lonab.bf
      - key: SYNC_INTERVAL_HOURS
        value: "6"
      - key: SIMULATION_RUNS
        value: "100000"
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
    healthCheckPath: /health

  # Frontend Next.js
  - type: web
    name: hippo-analytics-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: hippo-analytics-backend
          type: web
          property: host

databases:
  - name: hippo-analytics-db
    databaseName: hippo_analytics
    plan: free
