version: '3.9'

services:
  # ────────────────────────────────────────
  # Base de données PostgreSQL
  # ────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: hippo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hippo_analytics
      POSTGRES_USER: hippo_user
      POSTGRES_PASSWORD: hippo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hippo_user -d hippo_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # Backend FastAPI (Python)
  # ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hippo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://hippo_user:hippo_pass@db:5432/hippo_analytics
      SECRET_KEY: changeme_in_production_use_a_long_random_string
      LONAB_BASE_URL: https://www.lonab.bf
      SYNC_INTERVAL_HOURS: "6"
      SIMULATION_RUNS: "100000"
      UPLOAD_DIR: /app/uploads
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────
  # Frontend Next.js
  # ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hippo_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
